<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<style>
  :root { --amber: #ffb35c; --holo: #8fdcff; --ink: #e8f3ff; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: center; flex: none; }
  section { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; will-change: transform; }

  /* ---------------------------------------------------------------- the cockpit */
  #space { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #wash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
          background: radial-gradient(ellipse 60% 55% at 50% 36%, rgba(150,210,255,.38), rgba(90,150,255,.12) 45%, rgba(0,0,0,0) 72%); will-change: opacity; }
  #cockpit { position: absolute; left: -40px; top: -30px; width: 2000px; height: 1140px; will-change: transform; }
  #cockpit img { position: absolute; }                                   /* placed by the script (see CK) */
  #hud { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; will-change: transform; }
  #clock { position: absolute; left: 404px; top: 58px; color: #e4f2ff; text-shadow: 0 2px 14px rgba(0,0,0,.9), 0 0 18px rgba(120,200,255,.35); }
  #clock .t { font-size: 96px; font-weight: 200; letter-spacing: .02em; line-height: 1; }
  #clock .d { margin-top: 12px; font-size: 19px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; opacity: .7; padding-left: 4px; }
  /* on the monitor in the cockpit's right-hand wall: a box put onto the screen in perspective by the script (CK.screen),
     its lit face clipped clear of the metal bevel on its left */
  #clock.screen { left: 0; top: 0; width: 240px; height: 240px; transform-origin: 0 0; color: #b8e3ff; text-shadow: 0 0 9px rgba(110,190,255,.85);
                  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 23.6% 52.4%);
                  background: radial-gradient(ellipse 72% 62% at 62% 52%, rgba(90,170,255,.2), rgba(70,140,255,.07) 70%, rgba(70,140,255,.03)); }
  #clock.screen .t { position: absolute; left: 60px; right: 6px; top: 78px; text-align: center; font-size: 68px; font-weight: 500; letter-spacing: 0;
                     font-variant-numeric: tabular-nums; }
  #clock.screen .d { position: absolute; left: 34px; right: 6px; top: 166px; margin: 0; padding: 0; text-align: center; font-size: 25px; font-weight: 600;
                     letter-spacing: .16em; opacity: .85; }

  /* the apps: destinations out in space, seen through the canopy */
  #targets { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .tgt { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform, opacity; }
  .tgt img { position: absolute; left: 0; top: 0; transform: translate(-50%,-50%); opacity: .8; filter: drop-shadow(0 0 8px rgba(140,210,255,.7)); transition: opacity .3s, filter .3s; }
  .tgt.on img { opacity: 1; filter: drop-shadow(0 0 14px rgba(255,170,90,.95)) sepia(.45) saturate(1.9) hue-rotate(-14deg) brightness(1.12); }
  #reticle { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; will-change: transform; }
  #reticle svg { position: absolute; left: -130px; top: -130px; width: 260px; height: 260px; overflow: visible; filter: drop-shadow(0 0 6px rgba(255,150,60,.7)); }
  #appname { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font-size: 17px; font-weight: 500; letter-spacing: .34em;
             text-transform: uppercase; color: #ffd2a0; text-shadow: 0 0 10px rgba(255,160,80,.6); transition: opacity .25s; }
  /* an app with no logo here: its name */
  .tgt.word span { position: absolute; left: 0; top: 0; transform: translate(-50%,-50%); white-space: nowrap; font-size: 30px; font-weight: 500;
                   letter-spacing: .06em; color: #d6ecff; opacity: .8; text-shadow: 0 0 8px rgba(140,210,255,.7); transition: opacity .3s, color .3s; }
  .tgt.word.on span { opacity: 1; color: #ffd2a0; text-shadow: 0 0 14px rgba(255,170,90,.95); }
  /* Up in the cockpit: Customise, in the window above the centre pane */
  #cust { position: absolute; left: 0; right: 0; top: 66px; display: flex; justify-content: center; align-items: center; gap: 14px; opacity: 0;
          transition: opacity .25s; color: #ffd2a0; font-size: 17px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase;
          text-shadow: 0 0 10px rgba(255,160,80,.6); }
  #cust svg { width: 34px; height: 34px; filter: drop-shadow(0 0 6px rgba(255,150,60,.7)); }
  #cust.on { opacity: 1; }

  /* ---------------------------------------------------------------- the saga: six lightsabers on a rack, one for each film */
  #saga { transform: translate3d(0,1080px,0); background: #050608 url(img/hall.jpg) 0 0 / 1920px 1080px no-repeat; }    /* a hall in the Jedi Temple */
  .wash { position: absolute; inset: 0; opacity: 0; pointer-events: none; will-change: opacity; }
  #plinthGlow { position: absolute; left: 135px; width: 1650px; top: 704px; height: 2px; opacity: 0; will-change: opacity; }   /* the ledge's front edge */
  .saber { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
  .saber img { position: absolute; transition: filter .35s; filter: brightness(.5); }     /* the unlit ones sit in shadow */
  .saber.on img { filter: none; }
  .saber .cradle { position: absolute; left: -22px; top: -10px; width: 44px; height: 10px; border-radius: 0 0 8px 8px;
                   background: linear-gradient(180deg, #4a4f58, #1d1f24); box-shadow: inset 0 -2px 0 rgba(0,0,0,.4); }
  .blade { position: absolute; left: -32px; width: 64px; will-change: transform, opacity; transform: scaleY(0); }
  .blade.up { transform-origin: 50% 100%; }
  .blade.down { transform-origin: 50% 0; }
  .blade .glow { position: absolute; left: 12px; right: 12px; top: 0; bottom: 0; border-radius: 22px; background: var(--c); filter: blur(13px); opacity: .85; }
  .blade .core { position: absolute; left: 26px; width: 12px; top: 3px; bottom: 0; border-radius: 7px; background: #fff;
                 box-shadow: 0 0 4px #fff, 0 0 10px var(--c), 0 0 22px var(--c), 0 0 48px var(--c); }
  .blade.down .core { top: 0; bottom: 3px; }
  .saber .ep { position: absolute; left: -60px; width: 120px; top: 44px; text-align: center; font-size: 17px; font-weight: 500; letter-spacing: .12em;
               color: rgba(200,212,230,.38); transition: color .35s; }
  .saber.on .ep { color: rgba(235,242,255,.85); }
  #sagaTitle { position: absolute; left: 0; right: 0; top: 862px; text-align: center; will-change: opacity; }
  #sagaTitle .e { font-size: 18px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; color: rgba(225,233,245,.62); }
  #sagaTitle .t { margin-top: 8px; font-size: 52px; font-weight: 200; letter-spacing: .02em; color: #eef4ff; }
  #sagaTitle .y { margin-top: 10px; font-size: 20px; font-weight: 400; letter-spacing: .02em; color: rgba(215,225,240,.55); }

  /* ---------------------------------------------------------------- the Mandalorian: a camp at night, Din Djarin and Grogu, bounty pucks */
  #mando { transform: translate3d(0,2160px,0); background: #05070d; }
  #camp { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; will-change: transform; }    /* positions below are in the picture's 1920 frame */
  #camp > img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #fireglow { position: absolute; left: 1032px; top: 430px; width: 560px; height: 520px; border-radius: 50%; will-change: opacity;
              background: radial-gradient(closest-side, rgba(255,150,60,.30), rgba(255,120,40,.10) 50%, rgba(255,100,30,0)); }
  #sparks { position: absolute; left: 1232px; top: 360px; width: 160px; height: 340px; }
  #mshade { position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse 50% 42% at 12% 14%, rgba(4,6,16,.6), rgba(4,6,16,0) 70%); }
  .puck { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .puck .lens { position: absolute; left: -34px; top: -10px; width: 68px; height: 20px; border-radius: 50%; opacity: 0; will-change: opacity;
                background: radial-gradient(ellipse, rgba(200,240,255,.95), rgba(90,175,255,.65) 55%, rgba(60,140,255,0) 78%); }
  .puck .pool { position: absolute; left: -110px; top: -26px; width: 220px; height: 64px; border-radius: 50%; opacity: 0; will-change: opacity;
                background: radial-gradient(ellipse, rgba(110,195,255,.32), rgba(110,195,255,0) 70%); }
  .puck .halo { position: absolute; width: 440px; height: 440px; border-radius: 50%; opacity: 0; will-change: opacity;
                background: radial-gradient(closest-side, rgba(110,190,255,.13), rgba(110,190,255,0)); }
  .puck .beam { position: absolute; opacity: 0; will-change: opacity; background: linear-gradient(0deg, rgba(160,220,255,.55), rgba(120,200,255,.1)); }
  .puck .holo { position: absolute; width: 166px; height: 249px; opacity: 0; transform-origin: 50% 100%; will-change: transform, opacity; }
  .puck .holo img { width: 100%; height: 100%; display: block; }
  #mtitle { position: absolute; left: 150px; top: 124px; color: #f4ecff; text-shadow: 0 2px 16px rgba(0,0,20,.6); }
  #mtitle .k { font-size: 18px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; color: rgba(235,228,255,.7); }
  #mtitle .t { margin-top: 10px; font-size: 64px; font-weight: 200; letter-spacing: .02em; line-height: 1.08; }

  /* ---------------------------------------------------------------- the dark side: Vader on the bridge; through the windows, where each story is */
  #dark { transform: translate3d(0,3240px,0); background: #000; }
  #bridge { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; will-change: transform; }   /* positions below are in the picture's 1920 frame */
  #fg, #spills { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #glass { position: absolute; left: 368px; top: 136px; width: 1568px; height: 468px; will-change: transform; }   /* GL in the script */
  /* the light from outside, on the room only (masked by the bridge picture itself, so never on the glass) */
  #spills { pointer-events: none; -webkit-mask: url(img/dark/bridge.png) 0 0 / 1920px 1080px; mask: url(img/dark/bridge.png) 0 0 / 1920px 1080px; }
  .spill { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen; will-change: opacity; }
  #light { position: absolute; left: 352px; top: 0; width: 1568px; height: 916px; pointer-events: none; display: none; }   /* LIGHT in the script */
  /* only as large as the shadow it casts (under the title): a full-screen layer of mostly nothing still costs the TV a frame's worth of drawing */
  #dshade { position: absolute; left: 0; top: 620px; width: 920px; height: 460px; pointer-events: none;
            background: radial-gradient(921.6px 432px at 268.8px 308.8px, rgba(0,0,0,.7), rgba(0,0,0,0) 70%); }
  #dtitle { position: absolute; left: 150px; top: 806px; color: #eef2f8; text-shadow: 0 2px 16px rgba(0,0,0,.8); }
  #dtitle .k { font-size: 18px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; color: rgba(225,232,245,.62); }
  #dtitle .t { margin-top: 10px; font-size: 64px; font-weight: 200; letter-spacing: .02em; line-height: 1.08; }
  #dtitle .dots { margin-top: 22px; display: flex; gap: 10px; }
  #dtitle .txt { transition: opacity .22s, transform .4s cubic-bezier(.2,.8,.2,1); }
  #dtitle .txt.out { opacity: 0; transform: translateX(-28px); }
  #dtitle .txt.pre { opacity: 0; transform: translateX(36px); transition: none; }
  #dtitle .dots i { width: 28px; height: 3px; background: rgba(200,210,225,.25); transition: width .35s, background .3s, box-shadow .3s; }
  #dtitle .dots i.on { width: 56px; background: #ff3b30; box-shadow: 0 0 8px rgba(255,59,48,.8); }

  /* ---------------------------------------------------------------- jumping */
  #warp { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; opacity: 0; will-change: opacity; }
  #flash { position: absolute; inset: 0; background: #eaf6ff; opacity: 0; pointer-events: none; will-change: opacity; }
  #opening { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
             background: #000; opacity: 0; pointer-events: none; text-align: center; }
  #opening .t { font-size: 58px; font-weight: 200; letter-spacing: .06em; color: #e8f6ff; }

  /* ---------------------------------------------------------------- Customise: the apps in the cockpit, and where the films open */
  #custom { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none;
            background: radial-gradient(ellipse at 50% 22%, #0c1824, #020407 72%); }
  #custom.open { display: block; }
  #custom .box { position: absolute; left: 150px; width: 1620px; top: 70px; bottom: 60px; }
  #custom .h { font-size: 54px; font-weight: 200; letter-spacing: .04em; color: #e8f6ff; }
  #custom .sub { font-size: 23px; opacity: .7; margin-top: 12px; letter-spacing: .02em; }
  #custom .lab { margin-top: 34px; font-size: 17px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; color: #ffd2a0; }
  #custom .grid { margin-top: 16px; height: 424px; overflow: hidden; padding: 2px 6px; margin-left: -6px; }
  #custom .rows { display: grid; grid-template-columns: repeat(6, 254px); gap: 18px; transition: transform .25s; }
  #custom .tile { position: relative; height: 124px; border-radius: 12px; background: rgba(143,220,255,.05); border: 2px solid rgba(143,220,255,.16);
                  overflow: hidden; transition: transform .15s, box-shadow .15s; }
  #custom .tile img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; opacity: .8; }
  #custom .tile img.icon { left: 50%; top: 14px; width: 60px; height: 60px; margin-left: -30px; object-fit: contain; opacity: 1; }
  #custom .tile .t { position: absolute; left: 14px; right: 14px; bottom: 10px; font-size: 20px; white-space: nowrap; overflow: hidden;
                     text-overflow: ellipsis; text-align: center; }
  #custom .tile.banner .t { left: 0; right: 0; bottom: 0; padding: 22px 14px 8px; font-size: 17px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.8)); }
  #custom .tile .n { position: absolute; right: 10px; top: 9px; width: 34px; height: 34px; border-radius: 50%; background: #ffb35c; color: #1a1006;
                     font-size: 20px; font-weight: 600; line-height: 34px; text-align: center; display: none; }
  #custom .tile.sel { border-color: #ffb35c; background: rgba(255,179,92,.1); }
  #custom .tile.sel .n { display: block; }
  #custom .films { margin-top: 16px; display: flex; gap: 14px; flex-wrap: wrap; }
  #custom .pill, #custom .btn { padding: 12px 22px; border-radius: 40px; border: 2px solid rgba(143,220,255,.28); font-size: 20px; transition: transform .15s, box-shadow .15s; }
  #custom .pill.sel { background: #ffb35c; color: #1a1006; border-color: #ffb35c; }
  #custom .pill i { font-style: normal; opacity: .6; }
  #custom .btns { position: absolute; left: 0; bottom: 0; display: flex; gap: 22px; }
  #custom .btn { font-size: 23px; padding: 14px 44px; border-color: rgba(143,220,255,.45); }
  #custom .foc { box-shadow: 0 0 0 4px #8fdcff, 0 0 30px rgba(143,220,255,.45); transform: scale(1.04); }
  #custom .note { position: absolute; right: 0; bottom: 18px; font-size: 22px; opacity: .8; color: #ffd2a0; }

  /* ---- the TV (window.TV or ?tv): no blend modes (the spills sit in their own masked group, so screen over nothing
     is the same as plain transparency there) */
  body.tv .spill { mix-blend-mode: normal; }
</style>
</head>
<body>
<div id="stage">

  <!-- ============================================================ THE COCKPIT -->
  <section id="home">
    <canvas id="space" width="1920" height="1080"></canvas>
    <div id="targets"></div>
    <div id="reticle"><svg viewBox="-130 -130 260 260">
      <path stroke="#ffae55" fill="none" stroke-linecap="square" stroke-width="3" d="M-64 -40 V-64 H-40 M40 -64 H64 V-40 M64 40 V64 H40 M-40 64 H-64 V40"/>
    </svg></div>
    <div id="appname"></div>
    <div id="wash"></div>
    <div id="cockpit"><img id="frame" alt=""></div>
    <div id="hud">
      <div id="clock"><div class="t"></div><div class="d"></div></div>
      <div id="cust"><svg viewBox="0 0 24 24" fill="none" stroke="#ffae55" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.6 2.2 2.7-.6.6 2.7 2.4 1.3-1 2.6 1 2.6-2.4 1.3-.6 2.7-2.7-.6L12 21.2l-1.6-2.2-2.7.6-.6-2.7-2.4-1.3 1-2.6-1-2.6 2.4-1.3.6-2.7 2.7.6z"/></svg>Customise</div>
    </div>
  </section>

  <!-- ============================================================ THE SAGA -->
  <section id="saga">
    <div id="washes"></div>
    <div id="plinthGlow"></div>
    <div id="sabers"></div>
    <div id="sagaTitle"><div class="e"></div><div class="t"></div><div class="y"></div></div>
  </section>

  <!-- ============================================================ THE MANDALORIAN -->
  <section id="mando">
    <div id="camp">
      <img src="img/mando/camp.jpg" alt="">
      <div id="fireglow"></div>
      <canvas id="sparks" width="160" height="340"></canvas>
      <div id="pucks"></div>
    </div>
    <div id="mshade"></div>
    <div id="mtitle"><div class="k"></div><div class="t"></div></div>
  </section>

  <!-- ============================================================ THE DARK SIDE -->
  <section id="dark">
    <div id="bridge">
      <canvas id="glass" width="1568" height="468"></canvas>
      <img id="fg" src="img/dark/bridge.png" alt="">
      <div id="spills"></div>
      <canvas id="light" width="784" height="458"></canvas>
    </div>
    <div id="dshade"></div>
    <div id="dtitle"><div class="txt"><div class="k"></div><div class="t"></div></div><div class="dots"></div></div>
  </section>

  <canvas id="warp" width="1920" height="1080"></canvas>
  <div id="flash"></div>
  <div id="opening"><div class="t"></div></div>

  <!-- ============================================================ CUSTOMISE (Up in the cockpit) -->
  <div id="custom"><div class="box">
    <div class="h">Customise your cockpit</div>
    <div class="sub">Pick up to six apps for the cockpit, in the order you want them, then where the films and series open. Up in the cockpit brings you back here.</div>
    <div class="lab">The apps</div>
    <div class="grid"><div class="rows"></div></div>
    <div class="lab">The films and series open in</div>
    <div class="films"></div>
    <div class="btns"><div class="btn">Done</div><div class="btn">Start again</div></div>
    <div class="note"></div>
  </div></div>
</div>

<script src="config.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => x * x * (3 - 2 * x);
const spring = (x, k, z) => ({ x, v: 0, k, z });
function step(s, target, dt) { s.v += (-s.k * (s.x - target) - 2 * s.z * Math.sqrt(s.k) * s.v) * dt; s.x += s.v * dt; return s.x; }
const hash = k => (location.hash.match(new RegExp(k + "=([0-9.]+)")) || [])[1];
const css = (el, prop, v) => { if (el["_" + prop] !== v) { el.style[prop] = v; el["_" + prop] = v; } };
const W = 1920, H = 1080;
const TVMODE = !!window.TV || /[?&]tv\b/.test(location.search);           // the TV app (starwars-tv), or ?tv to preview its look
if (TVMODE) document.body.classList.add("tv");
const tap = (el, fn) => TVMODE || el.addEventListener("click", fn);      // no click targets on the TV: its WebView draws a focus box on them
const esc = x => String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ================================================================ settings: the apps in the cockpit and where the films open
// config.js gives the starting point; the Customise panel's choices are kept by the TV app (and in the page's storage when
// previewing in a browser) and win over it.
const DEFAULTS = window.STARWARS || { dock: [], films: "search", links: {} };
const HAS_TV = !!window.TV;
// a browser preview has no TV to ask: these stand in for its apps and HDMI ports
const SIM = {
  apps: [["com.amazon.amazonvideo.livingroom", "Prime Video"], ["com.apple.atve.androidtv.appletv", "Apple TV"], ["com.disney.disneyplus", "Disney+"],
         ["in.startv.hotstar", "JioHotstar"], ["com.wbd.stream", "Max"], ["com.netflix.ninja", "Netflix"], ["com.plexapp.android", "Plex"],
         ["com.spotify.tv.android", "Spotify"], ["com.google.android.youtube.tv", "YouTube"], ["com.android.tv.settings", "Settings", false],
         ["com.mediatek.factorymenu", "Factory Menu", false]].map(([pkg, label, media]) => ({ pkg, label, media: media !== false })),
  inputs: [{ id: "hdmi1", label: "HDMI 1" }, { id: "hdmi3", label: "PlayStation 5 · HDMI 3" }],
};
const parse = (j, d) => { try { return JSON.parse(j) || d; } catch (e) { return d; } };
const tvApps = () => HAS_TV ? parse(TV.apps(), []) : SIM.apps;
const tvInputs = () => HAS_TV ? parse(TV.inputs(), []) : SIM.inputs;
const inputMatch = (name, inp) => inp.id === name || inp.label.toLowerCase().includes(name.toLowerCase()) ||
                                  (/playstation|\bps[345]\b/i.test(name) && /playstation|\bps[345]\b/i.test(inp.label));
const tvHas = pkg => HAS_TV ? TV.has(pkg) : pkg.startsWith("input:") ? SIM.inputs.some(i => inputMatch(pkg.slice(6), i)) : SIM.apps.some(a => a.pkg === pkg);
function loadSettings() {
  let j = HAS_TV ? TV.loadConfig() : "";
  if (!j) try { j = localStorage.getItem("starwars") || ""; } catch (e) { }
  return j ? parse(j, null) : null;
}
function saveSettings() {
  const j = JSON.stringify(settings);
  if (HAS_TV) TV.saveConfig(j);
  try { localStorage.setItem("starwars", j); } catch (e) { }
}
const firstRun = !loadSettings() && DEFAULTS.askOnFirstRun !== false;      // config.js already set up for this TV: don't ask
const settings = Object.assign({ dock: DEFAULTS.dock, films: DEFAULTS.films }, loadSettings() || {});
// two cockpits: 1 from the back of the cockpit (img/cockpit.png), 2 from the pilots' seats (img/cockpit2.png, shown 15% larger,
// more canopy and less console). #cockpit2 in the address, or C on a keyboard, switches. pane: the centre pane in the picture.
const CK = /cockpit2/.test(location.hash) ? { src: "img/cockpit2.png", z: 1.15, cy: 486, pane: { x: 959, y: 525 } }

const NEB = document.createElement("canvas"); NEB.width = 2700; NEB.height = 1700;
{
  const g = NEB.getContext("2d"), w = 575, h = 350, small = document.createElement("canvas"); small.width = w; small.height = h;

// few frames so the TV has drawn every one of them before you first get there (shown all at once they'd hide each other
// and only the top one would get drawn).
let warm = 0, warmPlan = [];
const hold = (pg, n) => Array(n).fill(pg);
function liftCurtain() { curtain("", false); if (firstRun) setTimeout(openCustom, 900); }
if (TVMODE) {
  css($("#opening"), "transition", "none"); css($("#opening"), "opacity", ".995");   // not quite opaque, so what's behind still gets drawn
  warm = 1;
  const pics = [...document.images, ...DARK.map(d => d.view)].map(im => im.decode().catch(() => {}));
  Promise.race([Promise.all(pics), new Promise(r => setTimeout(r, 5000))]).then(() => {
    warmPlan = [...hold(1, 12), ...hold(2, 12), ...hold(3, 12), ...hold(0, 10), ...hold(section, 8)];
    warm = 0;
  });
}
// the planets take a moment to paint; the first one before anything shows, the rest after
renderPlanet(PLANETS[ship.planet]);
requestAnimationFrame(frame);
setTimeout(() => PLANETS.forEach(p => p.img || renderPlanet(p)), 300);
if (!TVMODE && firstRun) setTimeout(openCustom, 600);             // in a browser there's no warm-up curtain
</script>
